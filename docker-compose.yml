version: '3.8'

services:
  web:
    build: .
    container_name: b2b-web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    restart: unless-stopped
    networks:
      - frontend
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/api/leads.php" ]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: b2b-db
    restart: always
    environment:
      MYSQL_DATABASE: b2b_outreach
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    # Hidden from host for security-auditor alignment
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - BASE_URL=http://localhost:8080/
    dns:
      - 8.8.8.8
    networks:
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
